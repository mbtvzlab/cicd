services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: cicd
      POSTGRES_PASSWORD: cicd123
      POSTGRES_DB: cicd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicd -d cicd"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CiCdDbContext: "Host=db;Port=5432;Database=cicd;Username=cicd;Password=cicd123"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
